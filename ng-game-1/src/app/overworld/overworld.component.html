    <div style="background-image: url({{currentStage.picture}});height: 100%;background-position: center;background-repeat: no-repeat;background-size: cover;">
        <div class="flex">
            <div class="flexItemA">
                <h1 class="stageName">{{currentStage.name}}</h1>
                <button *ngIf="currentStage.canRest" type="button" class="btn btn-success btn-lg mb-1 btnGeneral btnRest" title="Try and take a rest." (click)="rest()"><img src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/3/3e/Clock_JE3_BE3.gif" style="width:32px">Rest</button>
                <button *ngIf="currentStage.canRefill" type="button" class="btn btn-primary btn-lg mb-1 btnGeneral" title="Replenish your thirst and water supply." (click)="refillWater()"><img src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/75/Water_Bottle_JE2_BE2.png" style="width:32px">Refill</button>
                <button *ngIf="currentStage.canCraft" type="button" class="btn btn-warning btn-lg mb-1 btnGeneral btnCraft" title="Craft items using materials." (click)="toggleCrafting()"><img src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/b/b7/Crafting_Table_JE4_BE3.png" style="width:32px">Craft</button>
                <button *ngIf="currentStage.canRepair" type="button" class="btn btn-secondary btn-lg mb-1 btnGeneral" title="Repair your tools and weapons."><img src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/3/3b/Anvil_(N)_JE3.png" style="width:32px">Repair</button>
                <button *ngIf="currentStage.canCook" type="button" class="btn btn-success btn-lg mb-1 btnGeneral" title="Cook food or smelt ores."><img src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/5/5c/Lit_Furnace_(S)_JE4.png" style="width:32px">Cook</button>
                <button type="button" class="btn btn-danger btn-lg mb-1 btnGeneral" title="Need to empty your pockets?"><img src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/74/Lava_Bucket_JE2_BE2.png" style="width:32px">Trash</button>
            </div>
            <div class="flexItemB">
                <button [disabled]="currentStage.numChests == 0" type="button" class="btn btn-success btn-lg mb-1 btnAction btnLoot" title="Let's see what this place has to offer..." (click)="loot()">
                    <div>
                        <img src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/2/26/Emerald_JE3_BE3.png" style="width: 64px">
                    </div>
                    <div>
                        Loot Chests
                    </div>                
                    <div>
                        ({{currentStage.numChests}} remaining)
                    </div>
                </button>

                <button [disabled]="!currentStage.numFish" *ngIf="currentStage.canFish" type="button" class="btn btn-primary btn-lg mb-1 btnAction btnFish" title="Try your luck!" (click)="fish()">
                    <div>
                        <img src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/e/ef/Raw_Cod_JE4_BE2.png" style="width: 64px">
                    </div>
                    <div>
                        Fish
                    </div>                
                    <div>
                        ({{currentStage.numFish}} tries left)
                    </div>
                </button>

                <button [disabled]="!currentStage.numGraves" *ngIf="currentStage.canDig" type="button" class="btn btn-dark btn-lg mb-1 btnAction" title="Watch out for zombies!" (click)="gravedig()">
                    <div>
                        <img src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/4a/Skeleton_Skull_(8).png" style="width: 64px">
                    </div>
                    <div>
                        Dig
                    </div>       
                    <div>
                        ({{currentStage.numGraves}} tries left)
                    </div>         
                </button>

                <button [disabled]="!currentStage.numCrops" *ngIf="currentStage.canFarm" type="button" class="btn btn-success btn-lg mb-1 btnAction btnFarm" title="Harvest some crops!" (click)="harvest()">
                    <div>
                        <img src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/75/Wheat_JE2_BE2.png" style="width: 64px">
                    </div>
                    <div>
                        Harvest
                    </div>       
                    <div>
                        ({{currentStage.numCrops}} tries left)
                    </div>         
                </button>

            </div>
        </div>

        <div *ngIf="currentMessage" class="centered {{currentMessage.subject}}"> 
            <h1 class="mb-2">{{currentMessage.subject}}</h1>
            <img *ngIf="currentMessage.item" class="mb-2 lootImg" src="{{currentMessage.item.picture}}" style="width: 128px;padding: 20px;" title="{{currentMessage.item.name}}&#013;[{{currentMessage.item.rarity}} {{currentMessage.item.type}}]&#013;&#013;{{currentMessage.item.description}}">
            <p>{{currentMessage.description}}</p>
            <h1 style="cursor:pointer;text-shadow: rgb(255, 0, 0) 1px 0 10px;" (click)="clearMessage()">[ X ]</h1>
        </div>

        <div *ngIf="craftingOpen" class="craftingGUI">
            <h2 style="color:white;text-shadow: 0 0 1px black;">Crafting<span class="closeCrafting" (click)="toggleCrafting()">X</span></h2>
            <div class="craftingContainer">
                <div *ngFor="let item of this.game.$craftableItems.value" class="craftItem">
                    <div class="craftBox {{item.rarity}}">
                        <ng-container [ngSwitch]="item.type">
                            <img *ngSwitchCase="'Weapon'" class="inventoryItem itemImg" src="{{item.picture}}" title="[CLICK TO CRAFT]&#013;{{item.name}}&#013;[{{item.rarity}} {{item.type}}]&#013;&#013;{{item.description}}&#013;&#013;Durability: {{item.durability}}">
                            <img *ngSwitchCase="'Head Armor'" class="inventoryItem itemImg" src="{{item.picture}}" title="[CLICK TO EQUIP]&#013;{{item.name}}&#013;[{{item.rarity}} {{item.type}}]&#013;&#013;{{item.description}}&#013;&#013;Durability: {{item.durability}}">
                            <img *ngSwitchCase="'Body Armor'" class="inventoryItem itemImg" src="{{item.picture}}" title="[CLICK TO EQUIP]&#013;{{item.name}}&#013;[{{item.rarity}} {{item.type}}]&#013;&#013;{{item.description}}&#013;&#013;Durability: {{item.durability}}">
                            <img *ngSwitchCase="'Leg Armor'" class="inventoryItem itemImg" src="{{item.picture}}" title="[CLICK TO EQUIP]&#013;{{item.name}}&#013;[{{item.rarity}} {{item.type}}]&#013;&#013;{{item.description}}&#013;&#013;Durability: {{item.durability}}">
                            <img *ngSwitchCase="'Boot Armor'" class="inventoryItem itemImg" src="{{item.picture}}" title="[CLICK TO EQUIP]&#013;{{item.name}}&#013;[{{item.rarity}} {{item.type}}]&#013;&#013;{{item.description}}&#013;&#013;Durability: {{item.durability}}">
                            <img *ngSwitchCase="'Tool'" class="inventoryItem itemImg" src="{{item.picture}}" title="{{item.name}}&#013;[{{item.rarity}} {{item.type}}]&#013;&#013;{{item.description}}&#013;&#013;Durability: {{item.durability}}">
                            <img *ngSwitchCase="'Button'" class="inventoryItem itemImg" src="{{item.picture}}" title="{{item.name}}&#013;[{{item.rarity}} {{item.type}}]&#013;&#013;{{item.description}}">
                            <img *ngSwitchCase="'Consumable'" class="inventoryItem itemImg" src="{{item.picture}}" title="[CLICK TO USE]&#013;{{item.name}}&#013;[{{item.rarity}} {{item.type}}]&#013;&#013;{{item.description}}">
                            <img *ngSwitchDefault class="inventoryItem itemImg" src="{{item.picture}}" title="{{item.name}}&#013;[{{item.rarity}} {{item.type}}]&#013;&#013;{{item.description}}">
                        </ng-container>
                    </div>
                </div>
            </div>
        </div>
    </div>
