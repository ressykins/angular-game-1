<app-menu></app-menu>
<div style="background-image: url({{this.game.combatBg}});height: 100%;background-position: center;background-repeat: no-repeat;background-size: cover;">
    <div class="flex">
        <div class="flexItemA">
            <div class="combatLog">
                <h5 style="text-align:center;text-decoration: underline;text-shadow: 0 0 32px black;">Combat Log</h5>
                <div class="chatLog">
                    <ng-container *ngFor="let message of this.game.combatLog;">
                        <p class="{{message[0]}}">{{message[1]}}</p>
                    </ng-container>
                </div>
            </div>
        </div>
        <div class="enemy-container">
            <ng-container *ngFor="let enemy of this.game.combatEnemies; let i = index">
                <img src="{{enemy.enemyPicture}}" class="enemyImg">
            </ng-container>
        </div>
    </div>
</div>
